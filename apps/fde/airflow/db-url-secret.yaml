---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-db-url
  namespace: fde
type: Opaque
stringData:
  # Derived from the CNPG read-write service and the canonical djangma password.
  connection: postgresql://airflow:${password}@airflow-db-rw.fde.svc.cluster.local:5432/airflow?sslmode=disable
