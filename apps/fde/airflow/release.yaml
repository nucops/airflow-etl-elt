apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: fde
spec:
  interval: 1h
  timeout: 15m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: airflow
      version: 1.22.0
      sourceRef:
        kind: HelmRepository
        name: apache-airflow
        namespace: fde
  valuesFrom:
    - kind: ConfigMap
      name: airflow-values
      valuesKey: values.yaml
