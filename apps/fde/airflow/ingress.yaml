apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: airflow
  namespace: fde
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Apache Airflow DAG orchestrator for FDE AI data pipelines.
    gethomepage.dev/group: AI & Data
    gethomepage.dev/icon: https://assets.cossth.com/icons/airflow.png
    gethomepage.dev/name: Airflow
    gethomepage.dev/href: https://airflow.${ADDITIONAL_DOMAIN_1}
    gethomepage.dev/siteMonitor: https://airflow.${ADDITIONAL_DOMAIN_1}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`airflow.${ADDITIONAL_DOMAIN_1}`)
      kind: Rule
      services:
        - name: airflow-webserver
          port: 8080
  tls: {}
