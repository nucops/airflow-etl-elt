# ---
# # 1. CloudNativePG Database User Secret (airflow-db-app)
# # Referenced by Cluster (spec.bootstrap.initdb.secret.name)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: airflow-db-app
#   namespace: fde
# type: Opaque
# stringData:
#   username: airflow
#   password: changeme-super-secret-password

# ---
# # 2. Airflow Metadata Database Connection URL Secret (airflow-db-url)
# # Referenced by Helm values (data.metadataSecretName)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: airflow-db-url
#   namespace: fde
# type: Opaque
# stringData:
#   connection: postgresql://airflow:changeme-super-secret-password@airflow-db-rw.fde.svc.cluster.local:5432/airflow?sslmode=disable

# ---
# # 3. Airflow Webserver Flask Session Secret Key (airflow-webserver-secret)
# # Referenced by Helm values (webserverSecretKeySecretName)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: airflow-webserver-secret
#   namespace: fde
# type: Opaque
# stringData:
#   webserver-secret-key: changeme-random-32-byte-hex-key

