name: Validate manifests

on:
  pull_request:
  push:
    branches:
      - main
      - solution

permissions:
  contents: read

jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install kubectl
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
        with:
          version: latest

      - name: Render manifests
        run: kubectl kustomize . > rendered.yaml

      - name: Reject secret resources
        shell: bash
        run: |
          if grep -Eq '^kind: (Secret|SealedSecret)$' rendered.yaml; then
            echo 'Public manifests must not contain secret resources.' >&2
            exit 1
          fi

      - name: Validate Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          entrypoint: /kubeconform
          args: -ignore-missing-schemas -strict -summary rendered.yaml
